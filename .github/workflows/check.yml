name: Rust checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo check --all-targets --locked
      - run: cargo test --locked
